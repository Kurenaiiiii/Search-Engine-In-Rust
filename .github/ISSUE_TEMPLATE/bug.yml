name: Bug report
description: Something broken in the engine, server, or CLI
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command or request, expected vs actual output
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest corpus + query/command that shows it
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
